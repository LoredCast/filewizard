# Builds the FileWizard images and publishes them to Docker Hub.
#
# - Pushing a version tag (git tag 0.5.4 && git push origin 0.5.4; "v0.5.4" and "0.5" work too)
#   runs tests, builds and smoke-tests all variants natively (amd64 + arm64), and publishes:
#     full:  0.5.4  0.5  0.5-latest  latest
#     small: 0.5.4-small  0.5-small  small
#     cuda:  0.5.4-cuda   0.5-cuda   cuda  latest-cuda
#   Pre-release tags (0.5.4-rc1) only get their version tags. scripts/docker-release.sh
#   computes the tags and does the same from your own machine.
# - Pull requests that touch the app or image build and smoke-test the small amd64 image without pushing.
# - "Run workflow" builds selected (or all) variants; with "push" checked they are published under
#   the chosen tag prefix (default: edge, edge-small and edge-cuda).
#
# Publishing needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with read/write scope); without them the images are only built and tested.
# Optional repository variable DOCKERHUB_IMAGE (default: loredcast/filewizard). See docs/docker.md.
name: Docker image

on:
  push:
    tags: ["v[0-9]+.[0-9]+*", "[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - locks/**
      - main.py
      - filewizard/**
      - settings.default.yml
      - templates/**
      - static/**
      - requirements-test.txt
      - tests/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
    inputs:
      push:
        description: Publish the built images to Docker Hub
        type: boolean
        default: false
      tag:
        description: Tag prefix when publishing via Run workflow (e.g. edge, test, pr-33)
        type: string
        default: edge
      variants:
        description: Which variants to build
        type: choice
        default: all
        options:
          - all
          - small
          - full
          - cuda

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'loredcast/filewizard' }}
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
  PUSH: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)) && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  test:
    name: Tests (gate before Docker build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies (constrained to locks/small.txt)
        run: |
          grep -E '^[A-Za-z0-9._-]+==' locks/small.txt | sed 's/ \\$//' > /tmp/constraints.txt
          python -m pip install --upgrade pip
          pip install -c /tmp/constraints.txt -r requirements-test.txt

      - name: Run pytest
        run: pytest -v

  build:
    name: build (${{ matrix.variant }}, ${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    outputs:
      push: ${{ env.PUSH }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: full,  platform: linux/amd64, runner: ubuntu-24.04 }
          - { variant: full,  platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { variant: small, platform: linux/amd64, runner: ubuntu-24.04 }
          - { variant: small, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { variant: cuda,  platform: linux/amd64, runner: ubuntu-24.04 }
    steps:
      - name: Note missing Docker Hub credentials
        if: env.PUBLISH == 'true' && env.PUSH != 'true' && matrix.variant == 'small' && matrix.platform == 'linux/amd64'
        run: echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set, so the images are built and tested but not published."

      - name: Determine whether to skip this matrix entry
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
          REQUESTED_VARIANTS: ${{ inputs.variants || 'all' }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ] && { [ "${VARIANT}" != "small" ] || [ "${PLATFORM}" != "linux/amd64" ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REQUESTED_VARIANTS}" != "all" ] && [ "${REQUESTED_VARIANTS}" != "${VARIANT}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space (the full images need ~25 GB while building)
        if: steps.scope.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        if: steps.scope.outputs.skip != 'true'

      - name: Prepare build metadata
        if: steps.scope.outputs.skip != 'true'
        env:
          DISPATCH_TAG: ${{ inputs.tag || 'edge' }}
        run: |
          # Timestamps inside the image come from the commit, so rebuilding a commit gives the same image.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            if ! printf '%s' "${DISPATCH_TAG}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
              echo "Invalid tag input: '${DISPATCH_TAG}'" >&2
              exit 1
            fi
            echo "VERSION=${DISPATCH_TAG}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          platform="${{ matrix.platform }}"
          plat_slug="${platform//\//-}"
          variant="${{ matrix.variant }}"
          echo "PLATFORM_PAIR=${variant}-${plat_slug}" >> "$GITHUB_ENV"
          {
            echo "CACHE_FROM<<EOF"
            echo "type=gha,scope=${variant}-${plat_slug}"
            if [ "${variant}" = "cuda" ]; then
              echo "type=gha,scope=full-${plat_slug}"
            fi
            if [ "${variant}" != "small" ]; then
              echo "type=gha,scope=small-${plat_slug}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.scope.outputs.skip != 'true' && env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every image is smoke-tested before anything is published; the push below reuses the build cache.
      - name: Build for testing
        if: steps.scope.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            VERSION=${{ env.VERSION }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          load: true
          tags: filewizard:test

      - name: Smoke test
        if: steps.scope.outputs.skip != 'true'
        run: docker/smoke-test.sh filewizard:test

      - name: Build and push by digest
        id: build
        if: steps.scope.outputs.skip != 'true' && env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            VERSION=${{ env.VERSION }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: ${{ env.CACHE_FROM }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - name: Export digest
        if: steps.scope.outputs.skip != 'true' && env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.skip != 'true' && env.PUSH == 'true'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish (${{ matrix.variant }})
    needs: build
    if: needs.build.outputs.push == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { variant: full,  suffix: "" }
          - { variant: small, suffix: "-small" }
          - { variant: cuda,  suffix: "-cuda" }
    steps:
      - name: Determine whether to skip this variant
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          VARIANT: ${{ matrix.variant }}
          REQUESTED_VARIANTS: ${{ inputs.variants || 'all' }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REQUESTED_VARIANTS}" != "all" ] && [ "${REQUESTED_VARIANTS}" != "${VARIANT}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.scope.outputs.skip != 'true'

      - uses: actions/download-artifact@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/login-action@v3
        if: steps.scope.outputs.skip != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.skip != 'true'

      - name: Compute tags
        id: tags
        if: steps.scope.outputs.skip != 'true'
        env:
          DISPATCH_TAG: ${{ inputs.tag || 'edge' }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            names="$(scripts/docker-release.sh tags "${GITHUB_REF_NAME}" "${{ matrix.variant }}")"
          else
            if ! printf '%s' "${DISPATCH_TAG}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
              echo "Invalid tag input: '${DISPATCH_TAG}'" >&2
              exit 1
            fi
            names="${DISPATCH_TAG}${{ matrix.suffix }}"
          fi
          tags=""
          for name in ${names}; do tags="${tags} ${IMAGE}:${name}"; done
          tags="${tags# }"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - name: Create multi-arch manifests
        if: steps.scope.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          for tag in ${{ steps.tags.outputs.tags }}; do args+=(-t "${tag}"); done
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect
        if: steps.scope.outputs.skip != 'true'
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do docker buildx imagetools inspect "${tag}"; done
