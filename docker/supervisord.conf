; Runs the web server and the background worker. Started by docker/entrypoint.sh as the
; unprivileged app user; logs go to the container's stdout/stderr.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
; Workers: WEB_CONCURRENCY (read by gunicorn). Extra options: GUNICORN_CMD_ARGS.
command=gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --threads 2 --timeout 120 --bind 0.0.0.0:8000 --forwarded-allow-ips="%(ENV_FORWARDED_ALLOW_IPS)s"
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=python -m huey.bin.huey_consumer main.huey --workers %(ENV_HUEY_WORKERS)s
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
